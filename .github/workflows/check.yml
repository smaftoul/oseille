name: check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Nix flake check
        run: nix flake check
      - name: Lint
        run: nix develop -c npm run lint
      - name: Typecheck
        run: nix develop -c npx tsc --noEmit
      - name: Build
        run: nix develop -c npm run build
      - name: Integration test (dev + prod)
        run: nix develop -c npm run test:integration
      - name: Install Playwright browsers
        run: nix develop -c npx playwright install
      - name: Playwright tests
        run: nix develop -c npm run test:pwa
      - name: Lighthouse (prod)
        run: nix develop -c npm run lhci:prod
